<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe — You vs Computer</title>
<style>
  :root {
    --bg1: #0f172a;
    --bg2: #1e293b;
    --cell: #1e293b;
    --cell-hover: #273449;
    --line: #334155;
    --x: #38bdf8;
    --o: #fb7185;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --win: #22c55e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 30% 20%, #1e293b 0%, #0f172a 60%, #020617 100%);
    color: var(--text);
    padding: 24px;
  }

  .app {
    width: 100%;
    max-width: 420px;
    background: rgba(30, 41, 59, 0.55);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.7);
  }

  h1 {
    text-align: center;
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  h1 .x { color: var(--x); }
  h1 .o { color: var(--o); }

  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 20px;
  }

  .scoreboard {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
  }
  .score {
    flex: 1;
    text-align: center;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(148, 163, 184, 0.12);
    border-radius: 14px;
    padding: 10px 6px;
    transition: transform 0.2s, border-color 0.2s;
  }
  .score.active {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .score .label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .score .value { font-size: 1.5rem; font-weight: 700; margin-top: 2px; }
  .score.you .value  { color: var(--x); }
  .score.draw .value { color: var(--muted); }
  .score.cpu .value  { color: var(--o); }

  .status {
    text-align: center;
    font-size: 1rem;
    font-weight: 600;
    min-height: 24px;
    margin-bottom: 16px;
    color: var(--text);
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    aspect-ratio: 1 / 1;
    margin-bottom: 22px;
  }

  .cell {
    background: var(--cell);
    border: none;
    border-radius: 16px;
    font-size: 2.8rem;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.08s;
    user-select: none;
    position: relative;
  }
  .cell:hover:not(:disabled) { background: var(--cell-hover); }
  .cell:active:not(:disabled) { transform: scale(0.96); }
  .cell:disabled { cursor: default; }
  .cell.x { color: var(--x); text-shadow: 0 0 18px rgba(56, 189, 248, 0.45); }
  .cell.o { color: var(--o); text-shadow: 0 0 18px rgba(251, 113, 133, 0.45); }
  .cell.win { background: rgba(34, 197, 94, 0.18); box-shadow: inset 0 0 0 2px var(--win); }

  .cell .mark {
    animation: pop 0.18s ease-out;
  }
  @keyframes pop {
    from { transform: scale(0.3); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .controls { display: flex; gap: 12px; }
  button.btn {
    flex: 1;
    padding: 13px;
    border-radius: 14px;
    border: none;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, filter 0.15s, opacity 0.15s;
  }
  button.btn:active { transform: scale(0.97); }
  .btn.new {
    background: linear-gradient(135deg, #38bdf8, #2563eb);
    color: white;
  }
  .btn.new:hover { filter: brightness(1.08); }
  .btn.quit {
    background: rgba(148, 163, 184, 0.15);
    color: var(--text);
    border: 1px solid rgba(148, 163, 184, 0.2);
  }
  .btn.quit:hover { filter: brightness(1.15); }

  .quit-screen {
    text-align: center;
    padding: 30px 0;
  }
  .quit-screen p { color: var(--muted); margin-bottom: 20px; line-height: 1.6; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="app">
    <h1><span class="x">Tic</span>-Tac-<span class="o">Toe</span></h1>
    <p class="subtitle">You (<span style="color:var(--x)">X</span>) vs Computer (<span style="color:var(--o)">O</span>) · the AI plays perfectly</p>

    <div id="game">
      <div class="scoreboard">
        <div class="score you"  id="scoreYou">
          <div class="label">You</div>
          <div class="value" id="winsYou">0</div>
        </div>
        <div class="score draw" id="scoreDraw">
          <div class="label">Draws</div>
          <div class="value" id="winsDraw">0</div>
        </div>
        <div class="score cpu" id="scoreCpu">
          <div class="label">Computer</div>
          <div class="value" id="winsCpu">0</div>
        </div>
      </div>

      <div class="status" id="status">Your turn</div>

      <div class="board" id="board"></div>

      <div class="controls">
        <button class="btn new"  id="newBtn">New Game</button>
        <button class="btn quit" id="quitBtn">Quit</button>
      </div>
    </div>

    <div id="quitView" class="quit-screen hidden">
      <p>Thanks for playing!<br>Final score — You <strong id="finalYou">0</strong>,
         Draws <strong id="finalDraw">0</strong>,
         Computer <strong id="finalCpu">0</strong>.</p>
      <button class="btn new" id="restartBtn" style="max-width:200px;margin:0 auto;">Play Again</button>
    </div>
  </div>

<script>
(function () {
  const HUMAN = 'X';
  const CPU   = 'O';

  const boardEl  = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const winsYouEl  = document.getElementById('winsYou');
  const winsDrawEl = document.getElementById('winsDraw');
  const winsCpuEl  = document.getElementById('winsCpu');

  const WIN_LINES = [
    [0,1,2],[3,4,5],[6,7,8], // rows
    [0,3,6],[1,4,7],[2,5,8], // cols
    [0,4,8],[2,4,6]          // diagonals
  ];

  let board = Array(9).fill('');
  let cells = [];
  let gameOver = false;
  let busy = false;               // true while CPU is "thinking"
  let humanStarts = true;         // alternates every game
  let current = HUMAN;
  const score = { you: 0, draw: 0, cpu: 0 };

  // ---- Build the board ----
  function buildBoard() {
    boardEl.innerHTML = '';
    cells = [];
    for (let i = 0; i < 9; i++) {
      const btn = document.createElement('button');
      btn.className = 'cell';
      btn.dataset.index = i;
      btn.addEventListener('click', () => onCellClick(i));
      boardEl.appendChild(btn);
      cells.push(btn);
    }
  }

  // ---- Game lifecycle ----
  function newGame() {
    board = Array(9).fill('');
    gameOver = false;
    busy = false;
    cells.forEach(c => {
      c.textContent = '';
      c.className = 'cell';
      c.disabled = false;
    });
    current = humanStarts ? HUMAN : CPU;
    humanStarts = !humanStarts; // alternate who starts next time

    if (current === HUMAN) {
      setStatus('Your turn');
    } else {
      setStatus("Computer starts…");
      busy = true;
      lockBoard(true);
      setTimeout(cpuMove, 450);
    }
    updateActiveScore();
  }

  function onCellClick(i) {
    if (gameOver || busy || board[i] !== '' || current !== HUMAN) return;
    place(i, HUMAN);
    if (finishIfOver()) return;
    current = CPU;
    busy = true;
    lockBoard(true);
    setStatus('Computer is thinking…');
    setTimeout(cpuMove, 420);
  }

  function cpuMove() {
    if (gameOver) return;
    const move = bestMove(board, CPU);
    place(move, CPU);
    if (finishIfOver()) return;
    current = HUMAN;
    busy = false;
    lockBoard(false);
    setStatus('Your turn');
  }

  function place(i, player) {
    board[i] = player;
    const c = cells[i];
    c.textContent = player;
    c.classList.add(player === HUMAN ? 'x' : 'o');
    c.disabled = true;
    // pop animation
    const span = document.createElement('span');
    // (text already set; re-trigger animation cheaply)
    c.classList.remove('pop');
  }

  function finishIfOver() {
    const result = evaluate(board);
    if (result.winner) {
      gameOver = true;
      highlight(result.line);
      lockBoard(true);
      if (result.winner === HUMAN) {
        score.you++; setStatus('🎉 You win!');
      } else {
        score.cpu++; setStatus('Computer wins.');
      }
      updateScores();
      updateActiveScore();
      return true;
    }
    if (isFull(board)) {
      gameOver = true;
      score.draw++;
      setStatus("It's a draw.");
      lockBoard(true);
      updateScores();
      updateActiveScore();
      return true;
    }
    return false;
  }

  // ---- Helpers ----
  function setStatus(t) { statusEl.textContent = t; }

  function lockBoard(locked) {
    cells.forEach((c, i) => {
      c.disabled = locked || board[i] !== '' || gameOver;
    });
  }

  function highlight(line) {
    if (!line) return;
    line.forEach(i => cells[i].classList.add('win'));
  }

  function updateScores() {
    winsYouEl.textContent  = score.you;
    winsDrawEl.textContent = score.draw;
    winsCpuEl.textContent  = score.cpu;
  }

  function updateActiveScore() {
    document.getElementById('scoreYou').classList.toggle('active', !gameOver && current === HUMAN);
    document.getElementById('scoreCpu').classList.toggle('active', !gameOver && current === CPU);
  }

  function isFull(b) { return b.every(v => v !== ''); }

  function evaluate(b) {
    for (const line of WIN_LINES) {
      const [a, c, d] = line;
      if (b[a] && b[a] === b[c] && b[a] === b[d]) {
        return { winner: b[a], line };
      }
    }
    return { winner: null, line: null };
  }

  // ---- Perfect AI via minimax ----
  // Returns the index of the optimal move for `player`.
  function bestMove(b, player) {
    let bestScore = -Infinity;
    let move = -1;
    for (let i = 0; i < 9; i++) {
      if (b[i] === '') {
        b[i] = player;
        const s = minimax(b, 0, false, player);
        b[i] = '';
        if (s > bestScore) { bestScore = s; move = i; }
      }
    }
    return move;
  }

  // Depth is used so the AI prefers faster wins and slower losses.
  function minimax(b, depth, isMax, aiPlayer) {
    const opponent = aiPlayer === CPU ? HUMAN : CPU;
    const result = evaluate(b);
    if (result.winner === aiPlayer) return 10 - depth;
    if (result.winner === opponent) return depth - 10;
    if (isFull(b)) return 0;

    if (isMax) {
      let best = -Infinity;
      for (let i = 0; i < 9; i++) {
        if (b[i] === '') {
          b[i] = aiPlayer;
          best = Math.max(best, minimax(b, depth + 1, false, aiPlayer));
          b[i] = '';
        }
      }
      return best;
    } else {
      let best = Infinity;
      for (let i = 0; i < 9; i++) {
        if (b[i] === '') {
          b[i] = opponent;
          best = Math.min(best, minimax(b, depth + 1, true, aiPlayer));
          b[i] = '';
        }
      }
      return best;
    }
  }

  // ---- Quit / restart ----
  const gameView = document.getElementById('game');
  const quitView = document.getElementById('quitView');

  document.getElementById('newBtn').addEventListener('click', newGame);

  document.getElementById('quitBtn').addEventListener('click', () => {
    document.getElementById('finalYou').textContent  = score.you;
    document.getElementById('finalDraw').textContent = score.draw;
    document.getElementById('finalCpu').textContent  = score.cpu;
    gameView.classList.add('hidden');
    quitView.classList.remove('hidden');
  });

  document.getElementById('restartBtn').addEventListener('click', () => {
    score.you = score.draw = score.cpu = 0;
    updateScores();
    humanStarts = true;
    quitView.classList.add('hidden');
    gameView.classList.remove('hidden');
    newGame();
  });

  // ---- Boot ----
  buildBoard();
  updateScores();
  newGame();
})();
</script>
</body>
</html>
